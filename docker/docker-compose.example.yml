# Distributed as input_data/docker-compose.yml, next to start.command, which runs it:
#   ./start.command      (or double-click it on macOS) -> starts the container and opens JupyterLab
# Run the workflow and the explorer from JupyterLab (notebook or terminal); the explorer is on http://localhost:8050.
# Ports are bound to 127.0.0.1 so neither JupyterLab nor the explorer is reachable from other machines.
services:
  jgi-integration:
    image: bkieft/jgi-integration:${tag:-latest}
    container_name: jgi-integration
    volumes:
      - ${PWD}:/home/jovyan/work/input_data
      - ${PWD}/../output_data:/home/jovyan/work/output_data
    working_dir: /home/jovyan/work/
    ports:
      - "127.0.0.1:8888:8888"   # JupyterLab
      - "127.0.0.1:8050:8050"   # integration explorer
